plugins { id 'com.android.application' }
def signDir = new File(System.getenv('GAME_SIGNING') ?: "${rootProject.projectDir}/../../game-signing")
def signFile = new File(signDir, 'signing.properties')
def signProps = new Properties()
if (signFile.exists()) { signFile.withInputStream { signProps.load(it) } }
gradle.taskGraph.whenReady { g ->
    if (g.allTasks.any { it.name.endsWith('Release') } && !signFile.exists())
        throw new GradleException("game-signing not found at ${signDir}. Clone bclark10121-cloud/game-signing outside this repo and set GAME_SIGNING (G1.9)")
}
android {
    namespace 'com.brianclark.wandervalley'
    compileSdk 36
    defaultConfig { applicationId 'com.brianclark.pixelhollow'; minSdk 24; targetSdk 36; versionCode 1; versionName '0.15.0' }
    // Pixel Hollow has its own package since v0.15.0. It installs next to the old Helena Hollow app, which keeps its own save.
    // G1.9: no key or password in this repo. The build reads them from the private repo game-signing,
    // cloned outside this repo. Set GAME_SIGNING to that folder (default: next to the Android project).
    signingConfigs { release { if (signFile.exists()) { storeFile new File(signDir, signProps['keystore']); storePassword signProps['store_password']; keyAlias signProps['alias']; keyPassword signProps['key_password'] } } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
